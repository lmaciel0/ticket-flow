# Render Blueprint: the whole deploy described as code (https://render.com/docs/blueprint-spec).
# Secrets and URLs marked "sync: false" are typed in the Render dashboard, never committed.
services:
  # API: Spring Boot in Docker. Free plan: sleeps after 15 min without traffic.
  - type: web
    name: ticket-flow-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend: static files built by Vite. Static sites never sleep.
  - type: web
    name: ticket-flow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      # Probe for roadmap 3.2: the site forwards /api/* to the API, so the refresh cookie can be first-party.
      # The frontend still calls the API directly (VITE_API_URL) until 3.2 switches it over.
      - type: rewrite
        source: /api/*
        destination: https://ticket-flow-api-a15n.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
