spring:
  application:
    name: ticket-flow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  tomcat:
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  zone: America/Sao_Paulo
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Local development only. Production must set JWT_SECRET (at least 32 bytes).
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 8h
  sla:
    deadlines:
      CRITICAL: 4h
      HIGH: 8h
      MEDIUM: 24h
      LOW: 72h
