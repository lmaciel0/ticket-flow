spring:
  application:
    name: ticket-flow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    hikari:
      # Small pool for Neon's free tier: idle connections are dropped after 30 s (minimum-idle 0),
      # so the database can suspend while the API sleeps instead of being held awake by the pool.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Render sets PORT (10000 by default); locally and in docker compose it stays 8080.
  port: ${PORT:8080}
  # Tomcat takes the client IP from a header only when the connection comes from an internal address (Render's
  # proxy). On Render, X-Forwarded-For ends with a Cloudflare edge address that changes on every request; the
  # visitor's address is in CF-Connecting-IP, which Cloudflare always overwrites, so a client cannot fake it.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: CF-Connecting-IP
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # Every log line of a request carries its trace id (see TraceIdFilter).
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  zone: America/Sao_Paulo
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Local development only. Production must set JWT_SECRET (at least 32 bytes).
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 15m
  auth:
    # The refresh token keeps the session for a week; each use replaces it (rotation) without extending it.
    refresh-ttl: 7d
    # One-time code that carries a login from the API's domain to the site's, where the cookie lives.
    handoff-ttl: 60s
    # Two tabs refreshing with the same cookie at the same time must not look like a stolen token.
    reuse-grace: 30s
    refresh-cookie:
      secure: true
  rate-limit:
    enabled: true
    login:
      capacity: 5
      period: 1m
    register:
      capacity: 3
      period: 1h
  sla:
    deadlines:
      CRITICAL: 4h
      HIGH: 8h
      MEDIUM: 24h
      LOW: 72h
    first-response:
      CRITICAL: 30m
      HIGH: 1h
      MEDIUM: 4h
      LOW: 8h
    business-hours:
      # Off by default (the SLA clock runs 24/7). When on, only Monday-Friday 08:00-18:00
      # (app.zone) counts; start, end, days and holidays can be overridden here.
      enabled: ${SLA_BUSINESS_HOURS:false}
  attachments:
    # database (default): bytes in PostgreSQL. s3: bytes in an S3-compatible bucket (AWS S3, MinIO...).
    storage: ${ATTACHMENTS_STORAGE:database}
    s3:
      endpoint: ${S3_ENDPOINT:}          # empty = real AWS S3; MinIO e.g. http://localhost:9000
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:ticket-flow-attachments}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false} # true for MinIO
      create-bucket: ${S3_CREATE_BUCKET:false}
