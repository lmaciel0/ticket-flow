spring:
  application:
    name: ticket-flow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    hikari:
      # Small pool for Neon's free tier: idle connections are dropped after 30 s (minimum-idle 0),
      # so the database can suspend while the API sleeps instead of being held awake by the pool.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Render sets PORT (10000 by default); locally and in docker compose it stays 8080.
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # Every log line of a request carries its trace id (see TraceIdFilter).
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  zone: America/Sao_Paulo
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Local development only. Production must set JWT_SECRET (at least 32 bytes).
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 8h
  sla:
    deadlines:
      CRITICAL: 4h
      HIGH: 8h
      MEDIUM: 24h
      LOW: 72h
